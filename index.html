<!DOCTYPE html>
<html lang="id"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>DLMS</title>
<meta name="description" content="DLMS 2 in 4 out - Digital Loudspeaker Management System by YSN Audio">
<meta name="theme-color" content="#05070a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{--bg:#05070a;--p:#0c1118;--p2:#111925;--ln:#1d2a3a;--tx:#e8eef6;--dm:#7d8da0;--rd:#d01820;--c1:#1e78ff;--c2:#1fa35a;--c3:#f06a10;--c4:#9a38e8}
:root[data-t=light]{--bg:#e9eef4;--p:#fff;--p2:#f1f5fa;--ln:#c9d4e0;--tx:#101822;--dm:#5b6b7e}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:14px system-ui,sans-serif;display:flex;min-height:100vh;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
button,select{font:inherit;color:var(--tx);background:var(--p2);border:1px solid var(--ln);border-radius:6px;padding:7px 10px}
button{cursor:pointer}button.on{background:var(--rd);border-color:var(--rd);color:#fff}
nav{width:190px;flex:none;background:var(--p);border-right:1px solid var(--ln);display:flex;flex-direction:column}
nav .lg{padding:16px 10px;text-align:center;font:900 34px/1 system-ui;letter-spacing:2px}nav .lg small{display:block;font:600 10px system-ui;letter-spacing:2px}
nav a{display:block;padding:12px 16px;color:var(--tx);text-decoration:none;border-left:3px solid transparent}
nav a.on{background:var(--rd);color:#fff}
main{flex:1;min-width:0;padding:10px}
header{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:6px 4px 12px}
.brand{font:italic 900 34px system-ui;color:var(--rd);letter-spacing:-1px}
header .sub{border-left:1px solid var(--ln);padding-left:14px}header .sub b{font-size:18px;display:block}header .sub span{color:var(--dm);font-size:12px}
.sp{flex:1}.st{color:#2ecc71;font-weight:600}.st.off{color:var(--dm)}
.card{background:var(--p);border:1px solid var(--ln);border-radius:10px;padding:10px;margin-bottom:10px}
h4{margin:0 0 8px;font-size:15px}
.row{display:grid;grid-template-columns:1fr 1.2fr 1.4fr;gap:10px}
.mt{display:flex;gap:14px;justify-content:space-around}
.mc{text-align:center;font-size:12px}
.m{position:relative;width:16px;height:110px;margin:4px auto;background:linear-gradient(#e33 0,#e33 6%,#ec3 22%,#3d3 45%,#2b2 100%);border-radius:2px;overflow:hidden}
.m i{position:absolute;left:0;right:0;top:0;background:#0b0f14;height:100%;transition:height .08s}
.m:after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(transparent 0 3px,#0b0f14 3px 4px)}
.brandc{text-align:center}.brandc .y{font:900 34px system-ui;letter-spacing:3px}.brandc .d{font:italic 900 22px system-ui}.brandc .d em{color:var(--rd)}
.outs{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.oc{background:var(--p);border:1px solid var(--ln);border-radius:10px;overflow:hidden}
.oc .h{display:flex;justify-content:space-between;padding:7px 10px;font-weight:700;color:#fff}
.oc .b{padding:8px 10px;display:grid;gap:6px}
.oc .l{display:flex;justify-content:space-between;align-items:center;gap:6px}
.kn{width:58px;height:58px;border-radius:50%;border:3px solid #26323f;background:radial-gradient(#2a3441,#10161e);position:relative;touch-action:none;cursor:ns-resize;flex:none}
.kn:after{content:"";position:absolute;left:50%;top:5px;width:3px;height:20px;margin-left:-1.5px;background:#fff;border-radius:2px;transform-origin:50% 21px;transform:rotate(var(--r,0deg))}
.stp{display:flex;align-items:center;justify-content:space-between;background:var(--p2);border:1px solid var(--ln);border-radius:6px;padding:2px}
.stp button{border:0;background:none;padding:4px 10px;font-size:16px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}.tabs button.on{background:var(--rd)}
.xo{display:grid;grid-template-columns:1.7fr 1fr;gap:12px}
canvas{width:100%;height:230px;background:var(--bg);border:1px solid var(--ln);border-radius:6px;display:block}
.sl{display:grid;grid-template-columns:90px 1fr 70px;gap:8px;align-items:center;margin:6px 0}.sl input{width:100%}
.xg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}.xg>div{border:1px solid;border-radius:8px;padding:6px;font-size:12px}
.xg label{display:flex;justify-content:space-between;align-items:center;margin:3px 0}.xg select{padding:3px;width:90px}
.bot{display:grid;grid-template-columns:1fr 1.2fr 1.6fr 1.3fr;gap:10px}
.pr{display:flex;gap:6px;margin:8px 0}.pr button{flex:1;padding:10px 0}
#spec{height:110px}
.badge{display:inline-block;background:#e6a100;color:#000;border-radius:4px;padding:1px 6px;font-size:11px;margin-left:6px}
#lc{height:190px}#sc{height:140px}.led{padding:2px 10px;border-radius:10px;font-size:12px;font-weight:700;background:#2a3038;color:#9aa}.led.o{background:#1f9d55;color:#fff;box-shadow:0 0 10px #2ecc71}.led.c{background:#8a1a22;color:#fff}.gm{position:relative;height:10px;background:#1b2430;border-radius:5px;margin:8px 0;overflow:hidden}.gm i{position:absolute;left:0;top:0;bottom:0;width:0;background:#2ecc71}.gm u{position:absolute;top:0;bottom:0;width:2px;background:#fff}.ind s{text-decoration:none;font-size:10px;padding:1px 5px;border-radius:4px;background:#222;color:#778;margin-left:3px}.ind s.a{background:#d33;color:#fff;box-shadow:0 0 8px #f33}.ind s.o{background:#1f9d55;color:#fff}.ind s.c{background:#6b1a20;color:#fff}
#gx,#gp{touch-action:none;cursor:crosshair}.wm{background:#020305;border-radius:10px;padding:2px 8px;display:block;margin:0 auto}header .wm{margin:0}input[type=number]{font:inherit;color:var(--tx);background:var(--p2);border:1px solid var(--ln);border-radius:6px;padding:6px;width:100%}.xg input{width:96px}.pq{display:grid;grid-template-columns:30px 1fr 1fr 1fr;gap:6px;align-items:center;margin:4px 0}.pq.h{color:var(--dm);font-size:12px}
@media(max-width:1000px){nav{display:none}.row,.xo,.bot{grid-template-columns:1fr}.outs{grid-template-columns:1fr 1fr}}
@media(max-width:520px){.outs{grid-template-columns:1fr}}
</style></head><body>
<nav>
 <div class="lg">YSN<small>AUDIO PRODUCTION</small></div>
 <a href="#home" class="on">Home</a><a href="#ci">Input</a><a href="#co">Output</a><a href="#cx" data-t="x">Crossover</a><a href="#cx" data-t="p">PEQ</a><a href="#cx" data-t="l">Limiter</a><a href="#cx" data-t="d">Delay</a><a href="#cx" data-t="n">Noise / Generator</a><a href="#cp">Presets</a><a href="#cr">RTA</a><a href="#cs">System</a>
</nav>
<main id="home">
<header>
 <img class="wm" src="logo-wordmark.png" alt="DLMS" style="height:54px">
 <div class="sub"><b>2in 4out</b><span>Digital Loudspeaker Management System</span></div>
 <div class="sp"></div>
 <span id="st" class="st off">&#9679; Belum terhubung</span><span id="dn" style="color:var(--dm)"></span>
 <button id="bc">Hubungkan</button><button id="bt" title="Tema">&#9788;</button><span id="clk"></span>
</header>

<div class="row">
 <div class="card" id="ci"><h4>INPUT</h4><div class="mt" id="mi"></div></div>
 <div class="card brandc"><img class="wm" src="logo-wordmark.png" alt="DLMS" style="height:96px"><div>2 IN 4 OUT</div><div style="color:var(--dm);font-size:12px">Digital Loudspeaker Management</div></div>
 <div class="card"><h4>OUTPUT</h4><div class="mt" id="mo"></div></div>
</div>

<div class="outs" id="co"></div>

<div class="card" id="cx" style="margin-top:10px">
 <div class="tabs" id="tabs"><b style="font-size:18px;margin-right:10px">Crossover &amp; EQ</b>
  <button data-t="x" class="on">Crossover</button><button data-t="p">PEQ</button><button data-t="l">Limiter</button><button data-t="n">Noise Gate</button><button data-t="g">Test Signal</button><button data-t="d">Delay</button></div>
 <div id="tb"></div>
</div>

<div class="bot">
 <div class="card"><h4>Input Level</h4><div class="mt" id="il"></div></div>
 <div class="card" id="cp"><h4>Presets</h4><div class="pr" id="ps"></div><div class="pr"><button id="sv">Save</button><button id="ld">Load</button></div></div>
 <div class="card" id="cr"><h4>RTA <button id="rt" style="float:right;padding:3px 10px">RTA</button></h4><canvas id="spec"></canvas></div>
 <div class="card" id="cs"><h4>System</h4>
  <div class="sl" style="grid-template-columns:1fr auto"><span>Bluetooth</span><span id="sb">-</span></div>
  <div class="sl" style="grid-template-columns:1fr auto"><span>Versi</span><span>v1.0.0</span></div>
  <div class="sl" style="grid-template-columns:1fr auto"><span>Tema</span><button id="th">Dark</button></div>
  <button id="sy" style="width:100%">Sinkron ulang ke alat</button></div>
</div>
</main>

<script>
'use strict';
const $=(s,r=document)=>r.querySelector(s),clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const U={S:'4fafc201-1fb5-459e-8fcc-c5c9c331914b',C:'beb5483e-36e1-4688-b7f5-ea07361b26a8',T:'beb5483e-36e1-4688-b7f5-ea07361b26a9',R:'beb5483e-36e1-4688-b7f5-ea07361b26aa',P:'beb5483e-36e1-4688-b7f5-ea07361b26ac',G:'beb5483e-36e1-4688-b7f5-ea07361b26ab'};
const FQ=[20,22,25,28,32,40,50,63,80,100,125,160,200,250,315,400,500,630,800,1000,1250,1600,2000,2500,3150,4000,5000,6300,8000,10000,12500,16000,20000];
const XM=[[2,0,3],[4,1,5],[6,7,8]],XT=[0,1,0,0,1,1,2,2,2],XS=[1,1,0,2,0,2,0,1,2];
const COL=['#1e78ff','#1fa35a','#f06a10','#9a38e8'];
const fh=f=>f>=1000?(f/1000).toFixed(f%1000?1:0)+' kHz':f+' Hz';
const S=Object.assign({gain:[0,0,0,0],mute:0,hpf:[20,20,20,20],lpf:[20000,20000,20000,20000],ht:[0,0,0,0],lt:[0,0,0,0],route:[0,1,2,2],phase:0,ig:[0,0],
 lim:Array.from({length:6},()=>({t:0,r:20,a:5,l:200})),delay:[0,0,0,0],peq:Array.from({length:6},()=>Array.from({length:9},()=>({f:19,g:0,q:10}))),gate:Array.from({length:4},()=>({e:0,t:-50,a:5,r:150})),gen:{m:0,l:-20},slot:0,tab:'x',ch:0,band:0},
 JSON.parse(localStorage.dlms||'{}'));
const save=()=>localStorage.dlms=JSON.stringify(S);
let tab=S.tab||'x';

/* ---------- BLE ---------- */
let ch={},dev=null,q=new Map(),busy=false,specOn=false,demo=false;
const i16=v=>[v&255,(v>>8)&255];
function send(key,bytes){q.set(key,bytes);if(!busy)pump()}
async function pump(){busy=true;while(q.size){const[k,b]=q.entries().next().value;q.delete(k);
 if(ch.C&&dev&&dev.gatt.connected){try{const d=new Uint8Array(b);ch.C.writeValueWithoutResponse?await ch.C.writeValueWithoutResponse(d):await ch.C.writeValue(d)}catch(e){}}
 await new Promise(r=>setTimeout(r,25))}busy=false}
async function connect(){
 try{
  dev=await navigator.bluetooth.requestDevice({filters:[{services:[U.S]}]});
  dev.addEventListener('gattserverdisconnected',()=>{ch={};setSt(false)});
  const sv=await(await dev.gatt.connect()).getPrimaryService(U.S);
  ch.C=await sv.getCharacteristic(U.C);
  for(const[k,id]of[['T',U.T],['R',U.R],['P',U.P],['G',U.G]]){ch[k]=await sv.getCharacteristic(id);await ch[k].startNotifications();
   ch[k].addEventListener('characteristicvaluechanged',e=>onNote(k,new Uint8Array(e.target.value.buffer)))}
  setSt(true);
  await ch.G.writeValueWithResponse(new Uint8Array([0x13]));
  setTimeout(()=>send('all',[0x0B]),300);
 }catch(e){if(e.name!=='NotFoundError')alert('Gagal terhubung: '+e.message)}
}
function setSt(on){const s=$('#st');s.textContent=on?'\u25CF Terhubung (Bluetooth)':'\u25CF Belum terhubung';s.className='st'+(on?'':' off');
 $('#dn').textContent=on&&dev?dev.name:'';$('#bc').textContent=on?'Putuskan':'Hubungkan';$('#sb').textContent=on?(dev.name||'OK'):'-';if(on)syncSpec()}
function onNote(k,d){
 if(k==='R'){for(let i=0;i<6;i++)lv[i]=d[i]/255*60-60}
 else if(k==='P'){spec=d.slice(2);drawSpec()}
 else if(k==='G'){
  if(d[0]===0x13&&d[1]===0){if(d[0+2]&&!d[0+3]){const p=prompt('Masukkan PIN alat:');if(p!==null)ch.G.writeValueWithResponse(new Uint8Array([0x10,...[...p].map(c=>c.charCodeAt(0))]))}}
  if(d[0]===0x10&&d[1]===8)alert('PIN salah');
 }else if(k==='T')parseStatus(d)}
function parseStatus(d){let p=0;const u=()=>d[p++],r16=()=>{const v=d[p]|d[p+1]<<8;p+=2;return v},s16=()=>{const v=r16();return v>32767?v-65536:v};
 for(let i=0;i<4;i++)S.route[i]=u();for(let i=0;i<4;i++)S.gain[i]=s16();for(let i=0;i<4;i++)S.hpf[i]=r16();for(let i=0;i<4;i++)S.lpf[i]=r16();
 const mm=u();S.mute=mm;for(let i=0;i<4;i++)S.ht[i]=u();for(let i=0;i<4;i++)S.lt[i]=u();
 if(d.length>p+1){const gm=u();for(let i=0;i<4;i++)S.gate[i].e=gm>>i&1;for(let i=0;i<4;i++)S.gate[i].t=s16()/10;for(let i=0;i<4;i++)S.gate[i].a=r16();for(let i=0;i<4;i++)S.gate[i].r=r16();S.gen.m=u();S.gen.l=s16()/10;S.ig=[s16(),s16()];S.phase=u();
  for(let i=0;i<6;i++)S.lim[i].t=s16()/10;for(let i=0;i<6;i++)S.lim[i].r=r16()/10;for(let i=0;i<6;i++)S.lim[i].a=r16();for(let i=0;i<6;i++)S.lim[i].l=r16()}
 save();renderAll()}

/* ---------- komponen ---------- */
function knob(el,get,set,min,max){
 const draw=()=>el.style.setProperty('--r',((get()-min)/(max-min)*270-135)+'deg');draw();
 let y0,v0;el.onpointerdown=e=>{el.setPointerCapture(e.pointerId);y0=e.clientY;v0=get()};
 el.onpointermove=e=>{if(y0==null)return;const v=clamp(Math.round(v0+(y0-e.clientY)/3),min,max);if(v!==get()){set(v);draw()}};
 el.onpointerup=()=>y0=null;el.ondblclick=()=>{set(0);draw()};
 el.onwheel=e=>{e.preventDefault();set(clamp(get()+(e.deltaY<0?1:-1),min,max));draw()}}
function stepper(label,get,set,fmt,step,min,max){const d=document.createElement('div');d.className='stp';
 d.innerHTML='<button>&#8249;</button><span></span><button>&#8250;</button>';const sp=d.children[1];const up=()=>sp.textContent=fmt(get());up();
 [d.children[0],d.children[2]].forEach((b,i)=>{let t;const go=()=>{set(clamp(+(get()+(i?step:-step)).toFixed(2),min,max));up()};
  b.onpointerdown=()=>{go();t=setTimeout(function r(){go();t=setTimeout(r,70)},400)};b.onpointerup=b.onpointerleave=()=>clearTimeout(t)});return d}
const meter=()=>{const m=document.createElement('div');m.className='m';m.appendChild(document.createElement('i'));return m}
const lv=[-60,-60,-60,-60,-60,-60],lvs=[...lv];
const lbl=(f1,f2)=>f1<=20&&f2>=20000?'Full Range':f1<=20?'Low':f2>=20000?'High':'Band';
function buildMeters(){
 $('#mi').innerHTML=$('#mo').innerHTML='';
 ['IN 1','IN 2','OUT 1','OUT 2','OUT 3','OUT 4'].forEach((n,i)=>{const c=document.createElement('div');c.className='mc';
  c.innerHTML=n+'<br>';c.appendChild(meter());c.insertAdjacentHTML('beforeend','<span class="v">-- dB</span>');(i<2?$('#mi'):$('#mo')).appendChild(c)})}
function tickMeters(){
 document.querySelectorAll('.mc').forEach((c,i)=>{const t=demo?-12-8*Math.abs(Math.sin(Date.now()/700+i)):lv[i];lvs[i]+=(t-lvs[i])*.4;
  c.querySelector('i').style.height=(100-clamp((lvs[i]+48)/48,0,1)*100)+'%';c.querySelector('.v').textContent=lvs[i]<=-59?'-- dB':lvs[i].toFixed(1)+' dB'});
 animCards();ANIM&&ANIM();requestAnimationFrame(tickMeters)}
function buildOuts(){const o=$('#co');o.innerHTML='';
 for(let i=0;i<4;i++){const c=document.createElement('div');c.className='oc';
  c.innerHTML=`<div class="h" style="background:${COL[i]}"><span>OUT ${i+1}</span><span>CH ${i+1}</span></div><div class="b"><div class="l"><b class="lb"></b><span class="ind"><s class="il">LIM</s><s class="ig">GATE</s></span><button class="mu">MUTE</button></div>
  <div class="l"><div>Gain<br><b class="gv"></b></div><div class="kn"></div></div><div>Delay</div><div class="dl"></div><div>Phase</div><div class="l ph"></div></div>`;o.appendChild(c);
  const gv=$('.gv',c);knob($('.kn',c),()=>S.gain[i],v=>{S.gain[i]=v;gv.textContent=v.toFixed(1)+' dB';send('g'+i,[2,i,...i16(v)]);save()},-40,6);gv.textContent=S.gain[i].toFixed(1)+' dB';
  $('.mu',c).onclick=()=>{S.mute^=1<<(i+2);send('m',[3,S.mute]);save();renderAll()};
  $('.dl',c).appendChild(stepper('',()=>S.delay[i]/10,v=>{S.delay[i]=Math.round(v*10);send('d'+i,[7,i,...i16(S.delay[i])]);save()},v=>v.toFixed(1)+' ms',.1,0,300));
  const pw=()=>{S.phase^=1<<i;send('ph',[0x0F,S.phase]);save();renderAll()};
  $('.ph',c).append(stepper('',()=>(S.phase>>i&1)*180,v=>{if(v!==(S.phase>>i&1)*180)pw()},v=>v+'\u00B0',180,0,180));
  const nb=document.createElement('button');nb.onclick=pw;nb.className='nb';$('.ph',c).append(nb)}}
function renderAll(){renderCards();drawTab()}
function renderCards(){
 document.querySelectorAll('.oc').forEach((c,i)=>{$('.mu',c).className='mu'+(S.mute>>(i+2)&1?' on':'');$('.lb',c).textContent=lbl(S.hpf[i],S.lpf[i]);
  $('.nb',c).textContent=S.phase>>i&1?'Invert':'Normal';$('.gv',c).textContent=S.gain[i].toFixed(1)+' dB'})}

/* ---------- tab Crossover/PEQ/Limiter/Delay ---------- */
const mag=(t,sl,fc,f,hp)=>{if(hp?fc<=20:fc>=20000)return 1;const n=[2,4,8][sl],r=hp?fc/f:f/fc;
 const b=n2=>1/Math.sqrt(1+Math.pow(r,2*n2));return t===0?b(n/2)**2:b(n)};
function peqDb(c,f){let s=0;S.peq[c].forEach(b=>{if(!b.g)return;const f0=FQ[b.f],g=b.g/10,Q=b.q/10,x=Math.log2(f/f0);s+=g*Math.exp(-(x*x)*Q*Q*1.2)});return s}
function graph(cv,fn){const dpr=devicePixelRatio||1,w=cv.clientWidth,h=cv.clientHeight;cv.width=w*dpr;cv.height=h*dpr;const g=cv.getContext('2d');g.scale(dpr,dpr);
 const X=f=>Math.log(f/20)/Math.log(1000)*(w-30)+25,Y=d=>(12-d)/36*(h-20)+4;g.strokeStyle='#2a3646';g.fillStyle='#7d8da0';g.font='10px sans-serif';
 [12,6,0,-6,-12,-18,-24].forEach(d=>{g.beginPath();g.moveTo(25,Y(d));g.lineTo(w,Y(d));g.stroke();g.fillText(d>0?'+'+d:d,0,Y(d)+3)});
 [20,50,100,200,500,1000,2000,5000,10000,20000].forEach(f=>{g.beginPath();g.moveTo(X(f),4);g.lineTo(X(f),h-16);g.stroke();g.fillText(f>=1000?f/1000+'k':f,X(f)-8,h-4)});
 fn(g,X,Y,w)}
function curve(g,X,Y,fnDb,col){g.strokeStyle=col;g.lineWidth=2;g.beginPath();for(let k=0;k<=160;k++){const f=20*Math.pow(1000,k/160),d=clamp(fnDb(f),-24,12);k?g.lineTo(X(f),Y(d)):g.moveTo(X(f),Y(d))}g.stroke()}
function row(l,min,max,step,val,fmt,cb){const d=document.createElement('div');d.className='sl';d.innerHTML=`<span>${l}</span><input type=range min=${min} max=${max} step=${step} value=${val}><b></b>`;
 const i=d.children[1],b=d.children[2];b.textContent=fmt(+i.value);i.oninput=()=>{b.textContent=fmt(+i.value);cb(+i.value)};return d}
function sel(opts,val,cb){const s=document.createElement('select');opts.forEach((o,i)=>s.add(new Option(o,i)));s.value=val;s.onchange=()=>cb(+s.value);return s}
function drawTab(){ANIM=null;const tb=$('#tb');document.querySelectorAll('#tabs button').forEach(b=>b.className=b.dataset.t===tab?'on':'');
 if(tb.dataset.k===tab+S.ch&&tab!=='x'&&tab!=='p'&&0)return;tb.innerHTML='';
 if(tab==='x'){tb.innerHTML='<div class="xo"><canvas id="gx"></canvas><div><b>Crossover Setting</b><div style="color:var(--dm);font-size:12px">Ketik frekuensi 20–20000 Hz, lalu Enter. HPF 20 = off, LPF 20000 = off.</div><div class="xg" style="grid-template-columns:1.4fr 1fr;border:0;padding:0;margin:6px 0"></div><div class="xg" id="xg"></div></div></div>';

   const t=d.firstChild;XL[i]=t;const mk=hp=>{const x=num(hp?S.hpf[i]:S.lpf[i],20,20000,1,v=>{v=Math.round(v);if(hp)S.hpf[i]=v;else S.lpf[i]=v;x.value=v;send((hp?'h':'l')+i,[hp?4:5,i,...i16(v)]);save();t.textContent='OUT '+(i+1)+' ('+lbl(S.hpf[i],S.lpf[i])+')';renderCards();xGraph()});XI[i*2+(hp?0:1)]=x;return x};

   const li=clamp(lvs[c<4?c+2:c-4],-60,0),gr=li-o(li),on=gr>0.1;g.fillStyle=on?'#f33':'#2ecc71';g.shadowColor=g.fillStyle;g.shadowBlur=on?16:6;g.beginPath();g.arc(X(li),Y(o(li)),6+(on?2*Math.sin(Date.now()/60):0),0,7);g.fill();g.shadowBlur=0;

   const g=cv.getContext('2d');g.setTransform(d,0,0,d,0,0);g.clearRect(0,0,w,h);const m=S.gen.m,A=clamp((S.gen.l+46)/43,.05,1)*.9;

   buf.forEach((v,k)=>{const px=k/239*w,py=h/2-v*h/2;k?g.lineTo(px,py):g.moveTo(px,py)});g.stroke();g.fillStyle=m?'#2ecc71':'#7d8da0';g.font='bold 12px sans-serif';g.fillText(m?['','WHITE NOISE','PINK NOISE'][m]+'  '+S.gen.l.toFixed(1)+' dB':'Generator mati',8,16)}}

function num(val,min,max,step,cb){const i=document.createElement('input');i.type='number';i.inputMode='decimal';i.min=min;i.max=max;i.step=step;i.value=val;
 i.onchange=()=>{let v=parseFloat(i.value.replace(',','.'));if(isNaN(v))v=val;cb(clamp(v,min,max))};return i}
const nearest=v=>FQ.reduce((a,f,i)=>Math.abs(Math.log(f/v))<Math.abs(Math.log(FQ[a]/v))?i:a,0);
let ANIM=null;const GO=[0,0,0,0];
function animCards(){document.querySelectorAll('.oc').forEach((c,i)=>{const l=lvs[2+i],L=S.lim[i],G=S.gate[i],a=$('.il',c),b=$('.ig',c);
 a.className='il'+(l>-59&&L.t<0&&l>=L.t-0.3?' a':'');
 if(!G.e){b.className='ig'}else{GO[i]=l>G.t+(GO[i]?-2:0)?1:0;b.className='ig '+(GO[i]?'o':'c')}})}
const XI=[],XL=[],P={inp:[]};
const nice=f=>clamp(Math.round(f<100?f:f<1000?Math.round(f/5)*5:Math.round(f/50)*50),20,20000);
function dragger(id,move,up){const cv=$(id);let h=null;const pt=e=>{const r=cv.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]};
 cv.onpointerdown=e=>{const[x,y]=pt(e);let best=null,bd=24;(cv._h||[]).forEach(o=>{const d=Math.hypot(o.x-x,o.y-y);if(d<bd){bd=d;best=o}});if(best){h=best;cv.setPointerCapture(e.pointerId)}};
 cv.onpointermove=e=>{if(!h)return;const[x,y]=pt(e);move(h,20*Math.pow(1000,clamp((x-25)/(cv.clientWidth-30),0,1)),12-(y-4)/(cv.clientHeight-20)*36)};
 cv.onpointerup=cv.onpointercancel=()=>{if(h){h=null;up&&up()}}}
const tot=(i,f)=>20*Math.log10(mag(XT[S.ht[i]],XS[S.ht[i]],S.hpf[i],f,true)*mag(XT[S.lt[i]],XS[S.lt[i]],S.lpf[i],f,false)+1e-6);
function xGraph(){const cv=$('#gx');cv._h=[];graph(cv,(g,X,Y)=>{for(let i=0;i<4;i++){curve(g,X,Y,f=>tot(i,f),COL[i]);
 [[true,S.hpf[i]],[false,S.lpf[i]]].forEach(([hp,f])=>{if(hp?f<=20:f>=20000)return;const x=X(f),y=Y(clamp(tot(i,f),-24,12));cv._h.push({x,y,i,hp});
  g.fillStyle=COL[i];g.strokeStyle='#fff';g.lineWidth=2;g.beginPath();g.arc(x,y,6,0,7);g.fill();g.stroke()})}})}
function pGraph(){const c=S.ch,cv=$('#gp');cv._h=[];graph(cv,(g,X,Y)=>{curve(g,X,Y,f=>peqDb(c,f),c<4?COL[c]:'#e33');
 S.peq[c].forEach((k,n)=>{const x=X(FQ[k.f]),y=Y(clamp(k.g/10,-24,12));cv._h.push({x,y,n});g.fillStyle='#fff';g.beginPath();g.arc(x,y,5,0,7);g.fill();g.fillStyle='#7d8da0';g.fillText(n+1,x-3,y-8)})})}
function setMode(t,s){const m=XM[t][s];for(let i=0;i<4;i++){S.ht[i]=S.lt[i]=m;send('xh'+i,[0x0D,i,0,m]);send('xl'+i,[0x0D,i,1,m])}save();drawTab()}

  knob($('.kn',c),()=>S.ig[i],v=>{S.ig[i]=v;b.textContent=v.toFixed(1)+' dB';send('ig'+i,[2,4+i,...i16(v)]);save()},-40,6);b.textContent=S.ig[i].toFixed(1)+' dB'}
 const ps=$('#ps');ps.innerHTML='';for(let i=0;i<5;i++){const b=document.createElement('button');b.textContent=i+1;b.className=S.slot===i?'on':'';b.onclick=()=>{S.slot=i;save();buildBottom()};ps.append(b)}
 $('#sv').onclick=()=>{send('sv',[0x0A,S.slot]);localStorage['dlmsP'+S.slot]=JSON.stringify({peq:S.peq,delay:S.delay})};

let spec=new Uint8Array(32);
function syncSpec(){if(ch.C)send('sp',[0x30,specOn?1:0,4,0])}
function drawSpec(){const c=$('#spec'),w=c.clientWidth,h=c.clientHeight,d=devicePixelRatio||1;c.width=w*d;c.height=h*d;const g=c.getContext('2d');g.scale(d,d);
 const bw=w/32;spec.forEach((v,i)=>{g.fillStyle=v>200?'#e33':v>140?'#ec3':'#3d3';const bh=v/255*(h-4);g.fillRect(i*bw+1,h-bh,bw-2,bh)})}
$('#rt').onclick=()=>{specOn=!specOn;$('#rt').className=specOn?'on':'';if(!specOn){spec=new Uint8Array(32);drawSpec()}syncSpec()};
